<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LibriVault - Library Catalogue</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <div class="container">
            <a href="#" class="logo">📚 LibriVault</a>

            <nav class="main-nav">
                <a href="#" class="nav-link active">Home</a>
                <a href="#catalogue" class="nav-link">Catalogue</a>
                <a href="#favourites" class="nav-link">Favourites</a>
            </nav>
        </div>
    </header>

    <main>
        <section id="catalogue" class="catalogue-section">
            <div class="catalogue-header">
                <h1>Library Catalogue</h1>
                <p>Explore our collection of books.</p>
            </div>

            <div class="search-container">
                <label for="search-input">Search books</label>
                <input
                    type="search"
                    id="search-input"
                    placeholder="Search by title or author..."
                    aria-label="Search books by title or author"
                >
            </div>

            <div class="filter-container">
                <label for="category-filter">Filter by category</label>
                <select id="category-filter">
                    <option value="all">All Categories</option>
                    <option value="Fiction">Fiction</option>
                    <option value="Fantasy">Fantasy</option>
                    <option value="Science">Science</option>
                    <option value="Technology">Technology</option>
                    <option value="Romance">Romance</option>
                    <option value="Adventure">Adventure</option>
                </select>
            </div>

            <div class="book-grid" id="book-grid"></div>
        </section>
    </main>

    <script src="apps.js"></script>
</body>
</html>
